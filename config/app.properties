# Base URL of a Jira Server/Data Center installation (without trailing slash).
jira.baseUrl=https://issues.apache.org/jira
# Project key, for example KAFKA or HDFS.
jira.project=KAFKA
# Optional credentials. Prefer environment variables JIRA_USER and JIRA_TOKEN.
jira.user=
jira.token=
# Calendar timezone used for daily counts.
report.zone=Europe/Moscow
report.output=report
# Minimum histogram interval in hours. 24 means at least one day per bar.
# The program widens intervals to keep at most 30 regular bars; every boundary is labelled.
report.binHours=24
# Number of issues per search request, not the total report size.
jira.pageSize=100
# Preview: newest jira.maxIssues issues. Set to 0 to process the entire project.
jira.maxIssues=1000
jira.sortOrder=DESC
