# Base URL of a Jira Server/Data Center installation (without trailing slash).
jira.baseUrl=https://issues.apache.org/jira
# Project key, for example KAFKA or HDFS.
jira.project=KAFKA
# Optional credentials. Prefer environment variables JIRA_USER and JIRA_TOKEN.
jira.user=
jira.token=
# Calendar timezone used for daily counts.
report.zone=Europe/Moscow
report.output=report
# Duration histogram bin width in hours.
report.binHours=24
jira.pageSize=100
